name: vga-remastered
recipe: laravel
config:
  webroot: public
  php: '8.4'
  database: mariadb:11.4
  cache: redis
  xdebug: 'develop,debug'

services:
  appserver:
    overrides:
      environment:
        PHP_IDE_CONFIG: "serverName=lando"
        XDEBUG_SESSION_START: lando

  phpmyadmin:
    type: phpmyadmin

  adminer:
    type: compose
    services:
      image: adminer:latest
      command: entrypoint.sh php -S [::]:8080 -t /var/www/html
      environment:
        ADMINER_DEFAULT_SERVER: database
        ADMINER_DESIGN: nette
    portforward: true

proxy:
  appserver:
    - vga-remastered.lndo.site
  phpmyadmin:
    - pma.vga-remastered.lndo.site
  adminer:
    - adminer.vga-remastered.lndo.site:8080
